  # US#176/US#179: MKT_LINE_MOVE_*/MKT_BOOK_DISAGREEMENT_* (closing-line
  # movement + cross-bookmaker disagreement) are STILL COMPUTED into
  # feature_store (see _compute_odds_features) but deliberately excluded
  # from selected_features/live-serving training -- they need the true
  # closing line, which by definition doesn't exist at live-forecast time
  # (build_for_match's synthetic row always has avgch/avgcd/avgca=NaN).
  # Verified live (2026-09-03): the chronological test split has ZERO rows
  # where this is missing (closing-odds coverage began before the test
  # window), so the promotion-gate MAE/log_loss measured on it never
  # actually exercised the always-missing-at-serving-time condition --
  # a real train/serve skew a normal cold-start gap doesn't have. Left
  # ingested/computed for backtest/agent-reasoning use (already-finished
  # matches genuinely have a closing line), just not fed to these 8 models.
  # US#174: Dixon-Coles walk-forward stacking features. Ungated -- needs
  # only home_team/away_team/fthg/ftag/date, present for every competition
  # (including Sweden), unlike the FotMob-dependent SQUAD-gated group below.
  - DC_LAMBDA_HOME
  - DC_LAMBDA_AWAY
  - DC_ATTACK_HOME
  - DC_DEFENSE_HOME
  - DC_ATTACK_AWAY
  - DC_DEFENSE_AWAY
  # US#178: corner sub-model, same walk-forward Dixon-Coles machinery
