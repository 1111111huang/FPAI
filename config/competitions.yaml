# Competition registry (Phase 14a, US#87).
# Maps each competition_id to its model tier and feature scope.
# tier: "general_purpose" (market-odds-only, works for any competition)
#       or "competition_specific" (full team-form feature set; player
#       features are added here in Phase 14c, gated by enabled_feature_groups).
#
# US#133: OFF/DEF/OPP_ADJ/STRENGTH/INTERACTION are split into per-dependency
# sub-tags (_GOALS/_SHOTS/_CORNERS) instead of one bare family tag, so a
# competition whose data source is missing shots/SOT/corners entirely (e.g.
# Sweden's Allsvenskan, football-data.co.uk "New Leagues" format -- goals and
# 1X2 odds only) can enable "goals" sub-features while omitting "shots"/
# "corners" ones, rather than falling back to cold-start imputation of a
# wholesale-missing column with another competition's mean. See
# src/logic/feature_groups.py for the classification and
# ModelManager._load_selected_features for where this is enforced.
#
# US#127: DIS (cards) is now a real, enforced tag (previously listed here but
# not actually gated by any code -- a docstring-only claim in US#133). Two
# new corner-dependent sub-tags, CTX_CORNERS and H2H_CORNERS, close the
# residual gap US#133 flagged (CTX_HOME/AWAY_CORNERS_STD_R5, H2H_CORNERS_R5
# previously passed through ungated regardless of enabled_feature_groups).
#
# US#129: optional `available_targets` list, keyed off src/logic/
# target_registry.py's TARGET_REGISTRY names. Omit the key entirely (as E0
# and international do below) to mean "no restriction -- every registered
# target is trainable," which is unchanged pre-US#129 behavior. Set it when
# a competition's data source doesn't populate the raw column(s) a target's
# labels need (e.g. a future Sweden entry would omit home_corners/
# away_corners/total_corners, since football-data.co.uk's "New Leagues" CSV
# has no hc/ac columns at all -- US#125's _NULL_COLUMNS). `train-forecast-
# suite --context <id>` uses this to skip unavailable targets with a logged
# reason instead of letting prepare_training_data's dropna(subset=["target"])
# silently drop every row (BUG-001's failure shape, on labels this time).
competitions:
  E0:
    competition_id: E0
    tier: competition_specific
    league_code: E0
    enabled_feature_groups:
      - OFF_GOALS
      - OFF_SHOTS
      - OFF_CORNERS
      - DEF_GOALS
      - DEF_SHOTS
      - DEF_CORNERS
      - OPP_ADJ_GOALS
      - OPP_ADJ_SHOTS
      - OPP_ADJ_CORNERS
      - STRENGTH_GOALS
      - STRENGTH_SHOTS
      - INTERACTION_GOALS
      - INTERACTION_SHOTS
      - DIS
      - CTX
      - CTX_CORNERS
      - H2H_CORNERS
      - MKT
      - EFFICIENCY
      - SQUAD
    player_data_sources:
      - fotmob
  SWE:
    competition_id: SWE
    tier: competition_specific
    league_code: SWE
    # Turned off display 2026-08-13: not a major league, and the big-5
    # leagues' season is starting -- fixtures endpoint, pregeneration, and
    # the nightly EOD/T-30 batch all skip it now (competition_registry.py's
    # display_enabled). Flip back to `true` (or delete the line) to
    # re-feature it -- everything else (data ingestion, trained model,
    # feature config) is untouched, so no data needs to be rebuilt.
    display_enabled: false
    enabled_feature_groups:
      - OFF_GOALS
      - DEF_GOALS
      - OPP_ADJ_GOALS
      - STRENGTH_GOALS
      - INTERACTION_GOALS
      - CTX
      - MKT
      - EFFICIENCY
    player_data_sources: []
    # US#129: Sweden's football-data.co.uk "New Leagues" source has no
    # hc/ac (corners) columns at all, so the 3 corners targets are excluded
    # here. home_win (legacy) is also excluded, matching E0's convention of
    # not listing it (E0 leaves available_targets unset entirely, but its
    # default training suite -- run_train_forecast_suite -- likewise skips
    # home_win; see tests/test_target_availability.py).
    available_targets:
      - result_3way
      - btts
      - home_goals
      - away_goals
      - total_goals
  SP1:
    competition_id: SP1
    tier: competition_specific
    league_code: SP1
    # US#143/US#147: live-verified 2026-08-06 that football-data.co.uk publishes
    # SP1 (La Liga) via spainm.php in the same rich per-season CSV format as E0
    # (englandm.php) -- identical column set (HS/AS/HST/AST/HC/AC/HY/AY/HR/AR,
    # Avg>2.5/Avg<2.5, AHh/AvgAHH/AvgAHA), scraped/loaded by the exact same
    # FootballDataScraper/CSVLoader.process_v1_csv with zero code changes. Real
    # ingested SP1 rows (10 seasons, 2015/16-2025/26, 3,800 matches) confirm
    # 100% non-null shots/corners/discipline/over-under/Asian-handicap columns
    # and 100% non-null B365-based odds -- full column parity with E0, unlike
    # Sweden's goals-only source. enabled_feature_groups therefore mirrors E0's
    # list exactly, MINUS SQUAD: FotMob's La Liga league id (87) is confirmed
    # live (US#146), but the actual `fetch-fotmob --league SP1` player-level
    # backfill (a slow, per-match job) has not been run yet -- flagged as a
    # fast-follow, not a data-availability gap like Sweden's. available_targets
    # is left unset (all 8 targets trainable), matching E0's convention, since
    # every raw column every target's labels depend on is fully populated.
    enabled_feature_groups:
      - OFF_GOALS
      - OFF_SHOTS
      - OFF_CORNERS
      - DEF_GOALS
      - DEF_SHOTS
      - DEF_CORNERS
      - OPP_ADJ_GOALS
      - OPP_ADJ_SHOTS
      - OPP_ADJ_CORNERS
      - STRENGTH_GOALS
      - STRENGTH_SHOTS
      - INTERACTION_GOALS
      - INTERACTION_SHOTS
      - DIS
      - CTX
      - CTX_CORNERS
      - H2H_CORNERS
      - MKT
      - EFFICIENCY
    player_data_sources: []
  I1:
    competition_id: I1
    tier: competition_specific
    league_code: I1
    # US#161/US#163/US#165: live-verified 2026-08-15 that football-data.co.uk
    # publishes I1 (Serie A) via italym.php in the same rich per-season CSV
    # format as E0/SP1 -- identical column set, scraped/loaded by the exact
    # same FootballDataScraper/CSVLoader.process_v1_csv with zero code
    # changes. Real ingested I1 rows (10 seasons, 2016/17-2025/26, 3,797
    # matches) confirm 100% non-null shots/corners/discipline/over-under/
    # Asian-handicap columns and 100% non-null B365-based odds -- full column
    # parity with E0/SP1. Real Understat xG backfill (US#165) reached 99.8%
    # coverage. enabled_feature_groups mirrors SP1's list exactly, MINUS
    # SQUAD: FotMob's Serie A league id (55) is confirmed live (US#165), but
    # the actual per-match player-level backfill has not been run yet --
    # flagged as a fast-follow, same posture as SP1's own SQUAD gap.
    # available_targets is left unset (all 8 targets trainable).
    enabled_feature_groups:
      - OFF_GOALS
      - OFF_SHOTS
      - OFF_CORNERS
      - DEF_GOALS
      - DEF_SHOTS
      - DEF_CORNERS
      - OPP_ADJ_GOALS
      - OPP_ADJ_SHOTS
      - OPP_ADJ_CORNERS
      - STRENGTH_GOALS
      - STRENGTH_SHOTS
      - INTERACTION_GOALS
      - INTERACTION_SHOTS
      - DIS
      - CTX
      - CTX_CORNERS
      - H2H_CORNERS
      - MKT
      - EFFICIENCY
    player_data_sources: []
  D1:
    competition_id: D1
    tier: competition_specific
    league_code: D1
    # US#161/US#163/US#165: live-verified 2026-08-15 that football-data.co.uk
    # publishes D1 (Bundesliga) via germanym.php in the same rich per-season
    # CSV format as E0/SP1/I1 -- identical column set, zero code changes.
    # Real ingested D1 rows (10 seasons, 2016/17-2025/26, 3,060 matches --
    # correctly lower than the 20-team leagues, Bundesliga is 18 teams)
    # confirm 100% non-null shots/corners/discipline/over-under/Asian-
    # handicap columns and 100% non-null B365-based odds. Real Understat xG
    # backfill (US#165) reached 100.0% coverage (the FotMob league id, 54,
    # needed extra care to disambiguate from the same endpoint's "2.
    # Bundesliga"/146 and Austria's own "Bundesliga"/938366 -- confirmed
    # against the real GER top-flight entry specifically). enabled_feature_
    # groups mirrors SP1/I1's list exactly, MINUS SQUAD (FotMob per-match
    # player backfill not yet run, same fast-follow posture).
    # available_targets left unset (all 8 targets trainable).
    enabled_feature_groups:
      - OFF_GOALS
      - OFF_SHOTS
      - OFF_CORNERS
      - DEF_GOALS
      - DEF_SHOTS
      - DEF_CORNERS
      - OPP_ADJ_GOALS
      - OPP_ADJ_SHOTS
      - OPP_ADJ_CORNERS
      - STRENGTH_GOALS
      - STRENGTH_SHOTS
      - INTERACTION_GOALS
      - INTERACTION_SHOTS
      - DIS
      - CTX
      - CTX_CORNERS
      - H2H_CORNERS
      - MKT
      - EFFICIENCY
    player_data_sources: []
  F1:
    competition_id: F1
    tier: competition_specific
    league_code: F1
    # US#161/US#163/US#165: live-verified 2026-08-15 that football-data.co.uk
    # publishes F1 (Ligue 1) via francem.php in the same rich per-season CSV
    # format as E0/SP1/I1/D1 -- identical column set, zero code changes.
    # Real ingested F1 rows (10 seasons, 2016/17-2025/26, 3,475 matches)
    # confirm 100% non-null shots/corners/discipline/over-under/Asian-
    # handicap columns and 100% non-null B365-based odds. Real Understat xG
    # backfill (US#165) reached 99.5% coverage. enabled_feature_groups
    # mirrors SP1/I1/D1's list exactly, MINUS SQUAD (FotMob per-match player
    # backfill not yet run, same fast-follow posture). available_targets
    # left unset (all 8 targets trainable).
    enabled_feature_groups:
      - OFF_GOALS
      - OFF_SHOTS
      - OFF_CORNERS
      - DEF_GOALS
      - DEF_SHOTS
      - DEF_CORNERS
      - OPP_ADJ_GOALS
      - OPP_ADJ_SHOTS
      - OPP_ADJ_CORNERS
      - STRENGTH_GOALS
      - STRENGTH_SHOTS
      - INTERACTION_GOALS
      - INTERACTION_SHOTS
      - DIS
      - CTX
      - CTX_CORNERS
      - H2H_CORNERS
      - MKT
      - EFFICIENCY
    player_data_sources: []
  international:
    competition_id: international
    tier: general_purpose
    league_code: null
    enabled_feature_groups:
      - MKT
    player_data_sources: []
