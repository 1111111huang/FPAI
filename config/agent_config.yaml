# Betting agent configuration — all tunable knobs.
# Swap model/provider to change the LLM tier without touching code.

model: "deepseek-v4-pro"        # A79, 2026-08-23: switched from gemini-3.6-flash -- NOT the same model as deepseek-chat/V4-Flash (A71's confirmed-broken default, 0 bets across 6 prompt variants). V4-Pro was validated separately (A77): a real 5-league test-split run (73 matches, --use-lessons) landed 4/5 leagues with positive ROI, the strongest real result of any provider tested this whole investigation, at a real cost of ~$1.29 USD. Chosen over gemini-3.6-flash directly because the Google AI Studio account backing GOOGLE_API_KEY hit RESOURCE_EXHAUSTED/"prepayment credits are depleted" live in production (A79) -- this is a genuine account-funding switch, not a reversal of A71's finding about deepseek-chat's decline bias, which is unrelated to this model.
provider: "deepseek"            # "ollama" | "anthropic" | "groq" | "gemini" | "deepseek"
# A68, 2026-08-18: 0.1 -> 0.0 for live serving too, not just backtesting -- this repo's own
# findings (agent_techspec.md Sec 18.6, A47) already showed 0.1 causes measurable run-to-run
# variance in the final recommendation itself, not just tool-call arguments; confirmed live by
# an incoherent direct_bet/negative-edge output this same investigation also fixed at the
# validation layer (A67). Doesn't fix model-capability gaps (BUG-023/024/027, fixed by the
# provider swap above) -- only reduces sampling noise on top of whatever the model would
# otherwise produce for identical inputs.
temperature: 0.0                # lower = more deterministic/stable
# Cut 10 -> 3 (2026-08-30, direct user request): both Tavily accounts hit
# their plan's usage limit in production -- research_node's 2 guaranteed
# baseline searches (availability, form) run on every run_agent() call
# regardless of this knob and aren't touched; this only bounds the agent's
# own *extra* discretionary web_search calls on top of that floor.
# ponytail: 3 is an untuned guess at "enough headroom for one genuine
# follow-up search without runaway cost" -- watch real tool_call_count usage
# and raise if matches are frequently hitting the cap before enough evidence.
max_tool_calls: 3                # per-match tool budget

# Value detection thresholds (A29, 2026-07-11: widened from a 2.0-only floor)
# Direct user request (2026-08-28): tightened from [1.2, 11.0] to the
# -140/+300 American range below -- production only, every posture/
# deepseek/backtest config keeps the wider [1.2, 11.0] band unchanged
# (docs/superpowers/specs/2026-08-21-agent-risk-posture-design.md's own
# "safety rails, not a posture dial" framing no longer holds for this one
# config specifically, by explicit user choice).
min_odds_threshold: 1.71        # never recommend direct_bet below this (decimal) / -140 American
max_odds_threshold: 4.0         # never recommend direct_bet above this (decimal) / +300 American
# A66, 2026-08-17: a 'conditional' (wait-for-a-better-price) market below this is too short
# a price for that strategy to be realistic -- downgraded to no_bet instead. Also the floor
# that makes a degenerate/missing-data current_odds (e.g. 0.0) impossible to pass through as
# a real price. Raised to match min_odds_threshold above (2026-08-28).
min_conditional_odds_threshold: 1.71   # decimal / -140 American
# New ceiling (2026-08-28, direct user request): a 'conditional' market
# above this is downgraded to no_bet too -- without it, a direct_bet priced
# above max_odds_threshold would downgrade to conditional (A29) and sail
# through with no upper bound at all. Every other config leaves this unset
# (unbounded default -- see AgentConfig.max_conditional_odds_threshold).
max_conditional_odds_threshold: 4.0    # decimal / +300 American
min_value_edge: 0.05            # model prob must exceed implied prob by at least this
# Agent-side guardrail (direct user request, 2026-08-29): result_3way's draw
# selection has an independently measured reliability problem the ML model
# itself can't currently fix -- the "draw-framing fallacy" lesson found only
# a 23-38% hit rate (28% aggregate across 85 picks, 5 leagues) despite an
# apparently-positive value_edge, root-caused to result_3way's training-time
# class-balance sample weighting inflating the model's own predicted P(draw)
# (docs/superpowers/specs/2026-08-20-result-3way-sample-weight-retune-design.md).
# Both obvious ML-side fixes (loading the existing-but-unused calibration
# sidecar at serving time; dampening the sample weighting further, already
# tried 2026-08-20) were confirmed live NOT to fix it -- see that spec's own
# results/2026-08-20-result-3way-verification.md. Production only, same
# scoping precedent as the odds-threshold tightening above; every other
# config leaves this unset (see AgentConfig.min_value_edge_result_3way_draw).
# ponytail: 0.15 is a first-pass heuristic sized off the observed inflation
# magnitude (e.g. a real 13.4% "edge" draw pick that was actually no_bet-grade,
# BUG-054/055), not a backtested-optimal value -- retune via agent-backtest
# once enough post-fix data exists.
min_value_edge_result_3way_draw: 0.15   # direct_bet on result_3way/draw needs this much edge, not just 0.05

# Markets the agent evaluates per match
markets:
  - result_3way
  - btts
  - total_goals
  - home_corners
  - away_corners

system_prompt_version: "v1"     # maps to config/prompts/agent_v1.txt
