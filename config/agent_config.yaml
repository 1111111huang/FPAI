# Betting agent configuration — all tunable knobs.
# Swap model/provider to change the LLM tier without touching code.

model: "claude-haiku-4-5"       # Anthropic (2026-07-23: switched after local models (~50% JSON reliability), Groq (reliable but 100K-500K tokens/day -- 10-50 days for this job), and 4 Gemini models (all quota-capped at 0-20 req/day on this project) all proved impractical. Real cost ~$1.50-2 for the full 404-match job.
provider: "anthropic"           # "ollama" | "anthropic" | "groq" | "gemini"
temperature: 0.1                # lower = more deterministic; use 0.0 for backtesting
max_tool_calls: 10              # per-match tool budget

# Value detection thresholds (A29, 2026-07-11: widened from a 2.0-only floor)
min_odds_threshold: 1.2         # never recommend direct_bet below this (decimal) / -500 American
max_odds_threshold: 11.0        # never recommend direct_bet above this (decimal) / +1000 American
min_value_edge: 0.05            # model prob must exceed implied prob by at least this

# Markets the agent evaluates per match
markets:
  - result_3way
  - btts
  - total_goals
  - home_corners
  - away_corners

system_prompt_version: "v1"     # maps to config/prompts/agent_v1.txt
