experiment_family: forecast_target
sweep_stage: narrow
version: v1
model_type: xgb_regressor
feature_schema_version: v1
league: E0
test_season: time_split

# US#69: Narrow grid — ±20% around Phase 7 best regressor params
# Regressors (goals/corners) tolerate slightly deeper trees and higher learning rates
grid_search:
  n_estimators: [400, 500, 600]
  max_depth: [3, 4, 5]
  learning_rate: [0.03, 0.05, 0.08]
  subsample: [0.75, 0.85]
  colsample_bytree: [0.75, 0.85]
  min_child_weight: [3, 5]
  reg_lambda: [1.0, 2.0]

fixed_params:
  random_state: 42
  n_jobs: -1
  tree_method: hist
  objective: reg:squarederror
  eval_metric: rmse
  early_stopping_rounds: 50

tags:
  experiment_methodology: target_model_narrow_grid
  split_policy: chronological_70_15_15
